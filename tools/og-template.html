<!DOCTYPE html>
<!-- Plantilla de la tarjeta que se ve al compartir el link.
     Se captura a 1200x630 y se guarda en assets/icons/og-image.png.
     Ver README > Regenerar assets. -->
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>og-image</title>
<link rel="stylesheet" href="../assets/css/estilos.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--naranja);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 0 72px;
  }
  .texto { display: flex; flex-direction: column; gap: 22px; flex: 1; }
  .marca-og { display: flex; align-items: center; gap: 14px; }
  .marca-og img { width: 56px; height: 56px; }
  .marca-og span {
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: 44px;
    line-height: 1;
  }
  h1 {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: 76px;
    line-height: 1.02;
    letter-spacing: -.02em;
    margin: 0;
  }
  .lead { font-size: 27px; line-height: 1.4; color: rgba(255, 255, 255, .94); max-width: 22ch; }
  .nota {
    align-self: start;
    background: #2F6B2F;
    color: #fff;
    font-weight: 700;
    font-size: 24px;
    padding: 14px 28px;
    border-radius: 999px;
  }
  .fono-og {
    flex: none;
    width: 300px;
    border-radius: 42px;
    background: #191512;
    padding: 10px;
    box-shadow: 0 26px 60px rgba(90, 40, 0, .38);
  }
  .fono-og img { border-radius: 32px; display: block; width: 100%; }
</style>
</head>
<body>
  <div class="texto">
    <div class="marca-og">
      <img src="../assets/img/logo-fruktela.png" alt="">
      <span>Fruktela</span>
    </div>
    <h1>Que tus clientes te pidan solos</h1>
    <p class="lead">Pedidos, clientes, productos y entregas en una sola app.</p>
    <span class="nota">Primer mes gratis</span>
  </div>
  <div class="fono-og">
    <img src="../assets/img/pagina-pedidos-896.webp" alt="">
  </div>
</body>
</html>
